[project]
name = "folivox"
version = "0.1.0.dev0"
description = "Turn e-books (FB2, EPUB, DOCX, PDF, TXT) into chaptered audiobooks locally with CosyVoice 3"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{ name = "vatavale" }]
keywords = ["audiobook", "tts", "cosyvoice", "fb2", "epub", "m4b", "russian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: Russian",
]
# Core: readers, text processing, CLI. Light enough for CI on every OS.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "lxml>=5",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "num2words>=0.5.13",
    "razdel>=0.5",
    "platformdirs>=4",
]

[project.optional-dependencies]
# Speech synthesis (CosyVoice 3, vendored) + stress marks.
tts = [
    "torch>=2.3,<2.6",
    "torchaudio>=2.3,<2.6",
    "numpy<2",
    "onnxruntime>=1.18,<1.24",
    "transformers==4.51.3",
    "hyperpyyaml>=1.2",
    "omegaconf>=2.3",
    "x-transformers>=1.30",
    "einops>=0.8",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "librosa>=0.10",
    "scipy>=1.10",
    "tiktoken>=0.7",
    "inflect>=7",
    "regex",
    "soundfile>=0.12",
    "huggingface-hub>=0.24",
    "ruaccent>=1.5",
]
# Whisper-based quality check of each take.
qa = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
all = ["folivox[tts,qa]"]

[project.scripts]
folivox = "folivox.cli:main"

[project.urls]
Homepage = "https://github.com/vatavale/folivox"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folivox"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/folivox/vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
