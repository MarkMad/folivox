# Folivox studio, NVIDIA GPU (needs the NVIDIA Container Toolkit on the host). Paste this into a Portainer / Dockhand stack, or run: docker compose up -d
# Set FOLIVOX_UI_TOKEN (the password of the studio, 16+ characters: openssl rand -hex 24) and, if you like,
# FOLIVOX_AUDIOBOOKS (the folder for finished audiobooks, e.g. your Audiobookshelf library) and PUID/PGID.
# Without a GPU use docker-compose.yml. RTX 50 series: set FOLIVOX_TAG=cuda128. Guide: docs/docker.md
services:
  folivox:
    image: ghcr.io/vatavale/folivox:${FOLIVOX_TAG:-cuda}
    container_name: folivox
    restart: unless-stopped
    ports:
      - "${FOLIVOX_PORT:-8765}:8765"
    environment:
      FOLIVOX_UI_TOKEN: ${FOLIVOX_UI_TOKEN:?Set FOLIVOX_UI_TOKEN to a password of at least 16 characters}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # FOLIVOX_PRELOAD_MODELS: "1"        # download the models (about 7.6 GB) at start instead of at the first render
      # FOLIVOX_UI_ALLOWED_HOSTS: "folivox.home.lan"   # answer only to these host names (behind a reverse proxy)
      # OPENAI_API_KEY: ""        # keys for cloud engines (the container has no keychain, so they go here)
      # FISH_API_KEY: ""
    volumes:
      - folivox-data:/data                                    # models, voices, settings, studio state
      - folivox-work:/work                                    # unfinished books: takes and journals (resume after a stop)
      - ${FOLIVOX_AUDIOBOOKS:-./audiobooks}:/audiobooks       # finished .m4b / .mp3 files
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  folivox-data:
  folivox-work:
