name: Docker images

# Publishes ghcr.io/vatavale/folivox on pushes to main and on v* tags; pull requests only build (cpu, amd64) to catch breakage.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            platforms: linux/amd64,linux/arm64
          - variant: cuda
            platforms: linux/amd64
          - variant: cuda128
            platforms: linux/amd64
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is 0.1.0.<commit count>, as in .githooks/pre-commit
      - id: ver
        run: echo "version=0.1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: matrix.variant == 'cpu'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vatavale/folivox
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}-${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ matrix.variant == 'cpu' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: VARIANT=${{ matrix.variant }}
          platforms: ${{ env.PUBLISH == 'true' && matrix.platforms || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
