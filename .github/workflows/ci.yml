name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os == 'Windows'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        if: runner.os == 'Linux'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      # Core + test deps only: readers, text processing, journal, assembly. No model inference.
      - run: uv sync --no-default-groups --group dev --group test
      - run: uv run ruff check src tests
      - run: uv run python scripts/check_i18n.py
        env:
          PYTHONUTF8: "1"
      - run: uv run pytest -q
        env:
          PYTHONUTF8: "1"
